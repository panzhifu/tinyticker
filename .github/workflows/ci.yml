name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libdbus-1-dev libxkbcommon-dev

      # 两个 feature 组合都过一遍：默认（Wayland + X11）与 Wayland 极小版
      - name: 构建（Wayland + X11）
        run: cargo build --release

      - name: 构建（仅 Wayland）
        run: cargo build --release --no-default-features

      - name: 测试
        run: cargo test --release

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
