name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # 构建不需要任何 X11 / Wayland / D-Bus 的 -dev 包：三边都是运行时 dlopen，
      # 编译期只有 std。这里装的只是校验 packaging/ 资产的元数据工具。
      - name: 安装资产校验工具
        run: |
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils libxml2-utils appstream

      # 打包资产随 release 一起发布，坏了会污染发行版元数据，所以在这里挡住
      - name: 校验打包资产
        run: |
          desktop-file-validate packaging/io.github.panzhifu.tinyticker.desktop
          appstreamcli validate --no-color packaging/io.github.panzhifu.tinyticker.metainfo.xml
          xmllint --noout packaging/io.github.panzhifu.tinyticker.svg

      # 两个 feature 组合都过一遍：默认（Wayland + X11）与 Wayland 极小版
      - name: 构建（Wayland + X11）
        run: cargo build --release

      - name: 构建（仅 Wayland）
        run: cargo build --release --no-default-features

      - name: 测试
        run: cargo test --release

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
