name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # 链接期依赖（非 dlopen）：x11rb 除 libxcb 外还要 render / shape / xfixes
      # 等扩展的 .so，wayland-client 需要 libwayland-client.so。
      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libx11-xcb-dev libxcb1-dev libxcb-render0-dev \
                                  libxcb-shape0-dev libxcb-xfixes0-dev libxcb-randr0-dev \
                                  libwayland-dev libxkbcommon-dev libdbus-1-dev

      # 两个 feature 组合都过一遍：默认（Wayland + X11）与 Wayland 极小版
      - name: 构建（Wayland + X11）
        run: cargo build --release

      - name: 构建（仅 Wayland）
        run: cargo build --release --no-default-features

      - name: 测试
        run: cargo test --release

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
