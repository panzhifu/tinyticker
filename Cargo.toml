[package]
name = "tinyticker"
version = "0.5.0"
edition = "2024"
license = "MIT"
description = "极简悬浮倒计时 / 秒表"

[dependencies]
# 零第三方依赖：Wayland 走 libwayland-client、X11 走 libX11/libXext、托盘与通知走
# libdbus，全部运行时 dlopen 发行版自带的共享库。二进制只硬链 libc 与 libgcc_s，
# 构建期也不需要任何 -dev 包。

[features]
# 默认构建额外包含 X11 后端（通用版）；关掉只剩 Wayland 极小版。
# 两种构建都没有第三方 crate，差的只是 src/x11.rs 这一个模块。
# Wayland 极小版: cargo build --release --no-default-features
default = ["x11"]
x11 = []

[profile.release]
strip = true          # 去除调试符号与符号表
lto = true            # 链接期优化
codegen-units = 1     # 单编译单元
opt-level = "z"       # 优化体积
panic = "abort"       # 不生成 unwind 代码
